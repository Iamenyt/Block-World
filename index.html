<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عالم المكعبات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{--bg:#9fd0f0;--ink:#0d2a36;--btn:#ffffff;--accent:#ff7a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
/* إطار اللعبة: يُدار بالجافاسكربت ليبقى أفقيًا دائمًا (يُدار 90° على الهاتف إذا كان رأسيًا) */
#game{position:fixed;left:0;top:0;transform-origin:0 0;transform:translate(0px,0px);overflow:hidden;background:var(--bg);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
#game.rot{--sat:0px;--sab:0px;--sal:0px;--sar:0px}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;top:calc(var(--sat) + 12px);right:calc(var(--sar) + 16px);max-width:60%;text-align:right;text-shadow:0 1px 3px rgba(255,255,255,.9)}
.hud h1{margin:0;font-size:20px}
.hud p{margin:2px 0 0;font-size:12px;opacity:.85}
.left{position:absolute;top:calc(var(--sat) + 12px);left:calc(var(--sal) + 12px)}
#map{width:96px;height:96px;border-radius:8px;border:2px solid #fff;image-rendering:pixelated;display:block}
.cross{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;mix-blend-mode:difference;z-index:5}
.cross::before,.cross::after{content:"";position:absolute;background:#fff}
.cross::before{left:-10px;top:-1px;width:20px;height:2px}
.cross::after{left:-1px;top:-10px;width:2px;height:20px}
#uw{position:absolute;inset:0;background:rgba(30,80,200,.28);opacity:0;pointer-events:none;transition:opacity .15s}
#hotbar{position:absolute;left:50%;bottom:calc(var(--sab) + 14px);transform:translateX(-50%);display:flex;direction:ltr;padding:3px;background:rgba(0,0,0,.45);border:2px solid #2b2b2b}
.slot{position:relative;width:46px;height:46px;border:3px solid #7d7d7d;background:rgba(90,90,90,.55);display:flex;align-items:center;justify-content:center}
.slot.on{border-color:#fff;outline:2px solid #111;z-index:1}
.slot canvas{width:30px;height:30px;image-rendering:pixelated}
.slot i{position:absolute;right:2px;bottom:0;font:700 11px/1 monospace;font-style:normal;color:#fff;text-shadow:1px 1px #000}
.narrow #hotbar{display:none}
#game:not(.narrow) #blk{display:none}
.bar{position:absolute;bottom:calc(var(--sab) + 20px);right:calc(var(--sar) + 14px);display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.row{display:flex;gap:8px;align-items:flex-end}
button{font:inherit;font-size:13px;padding:8px 12px;border:0;border-radius:12px;background:var(--btn);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent)}
#view{min-width:84px}
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 112px);transform:translateX(-50%);background:rgba(0,0,0,.68);color:#fff;padding:6px 14px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6;white-space:nowrap}
#dropbtn{min-width:56px}
#hearts{position:absolute;left:50%;bottom:calc(var(--sab) + 76px);transform:translateX(-50%);display:flex;direction:ltr;gap:1px;pointer-events:none;z-index:3;font-size:17px;line-height:1;text-shadow:0 1px 2px #000}
.ht.f{color:#e02828}.ht.e{color:#3a3a3a}
.ht.h{background:linear-gradient(90deg,#e02828 50%,#3a3a3a 50%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 90px 30px rgba(220,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
#death{position:absolute;inset:0;background:rgba(110,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:26px;font-weight:700;z-index:30}
#death button{font-size:17px;padding:12px 22px}
.round{width:58px;height:58px;border-radius:50%;padding:0;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
#jump{width:78px;height:78px;background:var(--accent);color:#fff;font-size:17px}
#run[aria-pressed="true"]{background:var(--accent);color:#fff}
#brk{background:#e5533d;color:#fff}
#put{background:#3f9d5a;color:#fff}
#sw{image-rendering:pixelated;width:34px;height:34px;border-radius:6px}
.stick{position:absolute;left:calc(var(--sal) + 18px);bottom:calc(var(--sab) + 22px);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.65);border:2px solid var(--accent);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--accent);pointer-events:none}
.top{position:absolute;left:50%;top:calc(var(--sat) + 8px);transform:translateX(-50%);display:flex;gap:8px}
.top button{padding:5px 10px;font-size:12px;opacity:.9} #gyrobtn[aria-pressed="true"]{background:var(--accent);color:#fff}
#flip{display:none}
.rot #flip{display:block}
#rotmsg{display:none;position:absolute;left:50%;top:30%;transform:translateX(-50%);max-width:80%;text-align:center;background:rgba(0,0,0,.7);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;pointer-events:none}
.rot #rotmsg{display:block;animation:fadeout 7s forwards}
@keyframes fadeout{0%,75%{opacity:1}100%{opacity:0;visibility:hidden}}
/* هواتف أفقية قصيرة الارتفاع */
.short .hud h1{display:none}
.short .hud{top:calc(var(--sat) + 8px)}
.short .left{top:calc(var(--sat) + 8px)}
.short #map{width:80px;height:80px}
.short .stick{width:120px;height:120px;bottom:calc(var(--sab) + 14px)}
.short .knob{width:50px;height:50px;margin:-25px 0 0 -25px}
.short .bar{bottom:calc(var(--sab) + 12px);gap:6px}
.short .row{gap:6px}
.short .round{width:50px;height:50px;font-size:13px}
.short #jump{width:66px;height:66px;font-size:15px}
.short button{padding:6px 10px;font-size:12px}
.short #hotbar{bottom:calc(var(--sab) + 8px)}
.short .slot{width:38px;height:38px}
.short .slot canvas{width:24px;height:24px}
.short .top{top:calc(var(--sat) + 6px)}
.left{display:flex;flex-direction:column;align-items:flex-start}
#coords{margin-top:4px;font:700 12px/1.3 monospace;color:#fff;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.4);padding:3px 7px;border-radius:4px;direction:ltr;white-space:pre}
.cnt{position:absolute;pointer-events:none;color:#fff;font-weight:700;font-family:monospace;text-shadow:1px 1px 0 #3f3f3f}
.slot .cnt{right:3px;bottom:2px;font-size:12px;line-height:12px}
.slot i{left:2px;top:0;right:auto;bottom:auto}
#desc{display:none}
#inv{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.6);direction:ltr;display:none;touch-action:none}
#inv.open{display:block}
#invpanel,#tblpanel,#chpanel,#ch2panel,#fupanel{position:absolute;width:176px;height:166px;transform-origin:0 0;background:#c6c6c6;box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #555,0 0 0 1px #000;font-family:monospace}
#pbox{position:absolute;left:26px;top:8px;width:50px;height:70px;background:#000;box-shadow:0 0 0 1px #373737,1px 1px 0 1px #fff;overflow:hidden}
#pbox canvas{width:100%;height:100%;display:block}
#invpanel .lbl,#tblpanel .lbl,#chpanel .lbl,#ch2panel .lbl,#fupanel .lbl{position:absolute;left:97px;top:7px;font:8px/8px monospace;color:#404040;direction:rtl}
#invpanel .arw,#tblpanel .arw,#fupanel .arw{position:absolute;left:134px;top:31px;width:22px;height:15px;background:#8b8b8b;clip-path:polygon(0 33%,55% 33%,55% 0,100% 50%,55% 100%,55% 67%,0 67%)}
.is{position:absolute;width:18px;height:18px;background:#8b8b8b;box-shadow:inset 1px 1px 0 #373737,inset -1px -1px 0 #fff}
.is canvas{position:absolute;left:1px;top:1px;width:16px;height:16px;pointer-events:none}
.is .cnt{right:0;bottom:-1px;font-size:8px;line-height:8px}
.is:hover::after{content:"";position:absolute;left:1px;top:1px;width:16px;height:16px;background:rgba(255,255,255,.5);pointer-events:none}
#curitem{position:absolute;left:0;top:0;width:16px;height:16px;transform-origin:0 0;pointer-events:none;display:none;z-index:2}
#curitem canvas{width:16px;height:16px;display:block}
#curitem .cnt{right:0;bottom:-1px;font-size:8px;line-height:8px}
#tip{position:absolute;display:none;pointer-events:none;background:rgba(16,0,16,.94);border:2px solid #2d0a63;color:#fff;padding:3px 7px;font-size:14px;white-space:nowrap;z-index:3}
#tblpanel,#chpanel,#ch2panel,#fupanel{display:none}
#ch2panel{height:222px}
#fupanel .flame{position:absolute;left:57px;top:37px;width:14px;height:14px;background:#4a4a4a;clip-path:polygon(50% 0,85% 30%,100% 65%,85% 100%,15% 100%,0 65%,15% 30%)}
#rbtn{position:absolute;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 12px);z-index:4}
#rbook{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 52px);bottom:calc(var(--sab) + 8px);width:200px;max-width:44%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:rgba(20,20,20,.84);border:2px solid #555;border-radius:6px;padding:6px;z-index:3;display:none;direction:rtl}
#rbook.show{display:block}
.rh{color:#ddd;font-size:11px;line-height:1.35;margin-bottom:6px;text-align:center}
.rc{display:flex;align-items:center;gap:8px;padding:5px;margin-bottom:5px;border-radius:5px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer;min-height:44px;user-select:none;-webkit-user-select:none}
.rc.no{opacity:.4}
.rc:active{background:rgba(255,255,255,.3)}
.rc canvas.ri{width:36px;height:36px;image-rendering:pixelated;flex:none;background:#8b8b8b;border-radius:3px}
.rc .rn{flex:1;line-height:1.25;min-width:0}
.rc .rn b{display:block;font-weight:600}
.rc .rg{display:flex;gap:4px;flex-wrap:wrap;direction:ltr;margin-top:3px}
.rc .rg span{position:relative;display:inline-block;width:18px;height:18px}
.rc .rg canvas{width:18px;height:18px;image-rendering:pixelated}
.rc .rg em{position:absolute;right:-2px;bottom:-4px;font:700 10px/10px monospace;font-style:normal;color:#fff;text-shadow:1px 1px #000}
.bar,.row,.top,.hud,#coords{pointer-events:none}
.bar button,.row button,.top button{pointer-events:auto}
#editlayer{position:absolute;inset:0;z-index:40;display:none;background:rgba(0,0,0,.2);touch-action:none}
.editing #editlayer{display:block}
#edbar{position:absolute;left:50%;top:calc(var(--sat) + 8px);transform:translateX(-50%);z-index:41;display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;border-radius:12px;font-size:13px;max-width:94%}
.editing #edbar{display:flex}
#edbar button{padding:6px 12px;font-size:13px}
#edname{min-width:140px;text-align:center}
.editing .top{display:none}
.editing #desc{display:flex!important}
.editing .ctl{outline:2px dashed #ffd23a;outline-offset:3px}
.editing .ctl.sel{outline:3px solid #fff}
#invclose{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 12px);z-index:3}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud"><h1>عالم المكعبات</h1><p id="hint"></p></div>
<div class="left" id="leftbox"><canvas id="map" width="96" height="96"></canvas><div id="coords"></div></div>
<div class="top"><button id="fs" hidden>ملء الشاشة</button><button id="flip">اقلب الاتجاه</button><button id="edbtn">تخصيص الأزرار</button><button id="gyrobtn" aria-pressed="false">تشغيل الجيروسكوب</button></div>
<div id="rotmsg">أدِر هاتفك جانبيًا لتلعب بالعرض، أو اضغط «اقلب الاتجاه» إذا كانت اللعبة مقلوبة</div>
<div id="uw"></div>
<div class="cross" aria-hidden="true"></div><div id="toast"></div><div id="hearts" aria-label="الصحة"></div><div id="hurt"></div><div id="death"><div>لقد متّ!</div><button id="respawn">العودة للحياة</button></div>
<div id="hotbar" aria-label="الكتل"></div>
<div class="stick" id="stick"><div class="knob" id="knob"></div></div>
<div class="bar">
 <div class="row"><button id="wave">لوّح</button><button id="dance">ارقص</button><button id="view">منظور ثالث</button><button id="invbtn">الحقيبة</button><button id="dropbtn">ارمِ</button></div>
 <div class="row"><button id="brk" class="round">كسر</button><button id="put" class="round">بناء</button><button id="blk" class="round" aria-label="نوع الكتلة"><canvas id="sw" width="16" height="16"></canvas></button></div>
 <div class="row"><button id="desc" class="round">هبوط</button><button id="run" class="round" aria-pressed="false">جري</button><button id="jump" class="round">قفز</button></div>
</div>
<div id="editlayer"></div><div id="edbar"><span id="edname"></span><button id="edminus" aria-label="تصغير">−</button><button id="edplus" aria-label="تكبير">+</button><button id="edreset1">إعادة العنصر</button><button id="edresetall">إعادة الكل</button><button id="eddone">تم</button></div>
<div id="inv"><div id="invpanel"></div><div id="tblpanel"></div><div id="chpanel"></div><div id="ch2panel"></div><div id="fupanel"></div><button id="rbtn">الوصفات</button><div id="rbook"></div><div id="curitem"></div><div id="tip"></div><button id="invclose">إغلاق</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const canvas=$('c');
const mobile=matchMedia('(pointer:coarse)').matches;
document.body.classList.add(mobile?'mob':'desk');
/* ===== تخطيط أفقي دائمًا ===== */
const game=$('game');
let GW=innerWidth,GH=innerHeight,rotDir=0,flip=false;
/* يحوّل إزاحة إصبع على الشاشة إلى إزاحة داخل اللعبة (عند تدوير الإطار) */
function gd(dx,dy){return rotDir===1?[dy,-dx]:rotDir===-1?[-dy,dx]:[dx,dy];}
function applyLayout(){
 const vw=innerWidth,vh=innerHeight;
 rotDir=mobile&&vh>vw?(flip?-1:1):0;
 GW=rotDir?vh:vw;GH=rotDir?vw:vh;
 game.style.width=GW+'px';game.style.height=GH+'px';
 game.style.transform=rotDir===1?`translate(${vw}px,0px) rotate(90deg)`:rotDir===-1?`translate(0px,${vh}px) rotate(-90deg)`:'translate(0px,0px)';
 game.classList.toggle('narrow',GW<700);game.classList.toggle('short',GH<430);game.classList.toggle('rot',rotDir!==0);}
applyLayout();
$('hint').textContent=mobile?'العصا للمشي · اسحب الشاشة للنظر':'WASD مشي · مسافة قفز (مرتين: طيران) · Shift جري/هبوط · V المنظور · E الحقيبة · كسر: F أو نقر يسار · بناء: G أو نقر يمين · 1-9';
const renderer=new THREE.WebGLRenderer({canvas,antialias:!mobile,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));
renderer.autoClear=false;
const SKYC=0x9fd0f0;
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKYC);
scene.fog=new THREE.Fog(SKYC,45,115);
const camera=new THREE.PerspectiveCamera(60,1,0.05,170);
const hemi=new THREE.HemisphereLight(0xffffff,0x8a9a80,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(4,10,6);scene.add(sun);

/* ================= بيانات العالم 128×128 ================= */
const W=128,H=48,SEA=10,WL=SEA+.9,CH=16,NCH=W/CH;
const world=new Uint8Array(W*H*W);
const meta=new Uint8Array(W*H*W);   /* اتجاه الفرن/الصندوق (بتّان) + حالة دمج الصندوق (بتّان) */
const furnData=new Map(),chestData=new Map();
const idx=(x,y,z)=>(y*W+z)*W+x;
const inB=(x,y,z)=>x>=0&&x<W&&z>=0&&z<W&&y>=0&&y<H;
function get(x,y,z){if(y<0)return 1;if(y>=H)return 0;if(x<0||x>=W||z<0||z>=W)return 1;return world[idx(x,y,z)];}
const solid=(x,y,z)=>{const b=get(x,y,z);return b!==0&&b!==13;}; /* الشعلة (13) لا تصطدم ولا تحجب الوجوه */
const topY=new Int16Array(W*W);
function recomputeTop(x,z){let y=H-1;while(y>0&&!world[idx(x,y,z)])y--;topY[x*W+z]=y;}

const SEED=20261009;
function hash(x,z){let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+SEED)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
 const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
 const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z){let s=0,a=.5,f=1,n=0;for(let i=0;i<4;i++){s+=vnoise(x*f,z*f)*a;n+=a;a*=.5;f*=2;}return s/n;}

/* أنواع الكتل: 1 عشب 2 تراب 3 حجر 4 رمل 5 خشب 6 أوراق 7 ألواح 8 طوب 9 ثلج */
for(let x=0;x<W;x++)for(let z=0;z<W;z++){
 const n=fbm(x/40,z/40);
 let h=Math.floor(13+(n-.5)*34+(vnoise(x/6,z/6)-.5)*2);
 const d=Math.hypot(x-64,z-64);h+=Math.round(Math.max(0,1-d/20)*4);
 h=Math.max(2,Math.min(H-12,h));
 const beach=h<=SEA+1;
 for(let y=0;y<=h;y++){
  let b;
  if(y===h)b=beach?4:h>=25?9:h>=21?3:1;
  else if(y>=h-3)b=beach?4:(h>=21?3:2);
  else b=3;
  world[idx(x,y,z)]=b;}
}
for(let x=3;x<W-3;x++)for(let z=3;z<W-3;z++){
 let h=H-1;while(h>0&&!world[idx(x,h,z)])h--;
 if(world[idx(x,h,z)]!==1||hash(x+101,z+57)>=.012)continue;
 if(Math.hypot(x-64,z-64)<5)continue;
 const th=4+((hash(x+7,z+3)*2)|0);
 for(let i=1;i<=th&&h+i<H;i++)world[idx(x,h+i,z)]=5;
 for(let dy=th-2;dy<=th+1;dy++){const r=dy>=th?1:2;
  for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
   if(r===2&&Math.abs(dx)===2&&Math.abs(dz)===2)continue;
   if(dy===th+1&&Math.abs(dx)+Math.abs(dz)>1)continue;
   if(dx===0&&dz===0&&dy<=th)continue;
   const y=h+dy;if(y>=H)continue;
   if(!world[idx(x+dx,y,z+dz)])world[idx(x+dx,y,z+dz)]=6;}}
}
/* ===== الحفظ التلقائي: تحميل ما بُني أو كُسر في المرات السابقة فوق العالم المولَّد ===== */
const base=world.slice();
const SAVE_KEY='cube_world_save_v1';
let SAVE=null;
const edits=new Map();let editsDirty=false,editsCache=null;
try{
 const raw=localStorage.getItem(SAVE_KEY);
 if(raw){const o=JSON.parse(raw);if(o&&o.v===1)SAVE=o;}
 const er=SAVE?localStorage.getItem(SAVE_KEY+'_edits'):null;

const itemGeoCache={};
function itemGeo(b){
 if(itemGeoCache[b])return itemGeoCache[b];
 let key,pal=SPRC;
 if(b===13)key='torch';else if(b===20)key='stick';else if(b===31)key='charcoal';
 else if(b>=32){key='x'+b;pal=Object.assign({},SPRC,XPAL[b]);}
 else{const t=b<26?0:1;key=t+KINDS[(b-21)%5];pal=Object.assign({},SPRC,TIERC[t]);}
 const g=SPRD[key],P=[],C=[],I=[];let vi=0;
 const op=(x,y)=>x>=0&&x<16&&y>=0&&y<16&&g[y][x]!=='.';
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){
  const ch=g[y][x];if(ch==='.')continue;
  const h=pal[ch]||SPRC[ch]||'#ffffff',col=[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
  const X=x-8,Y=8-y,z0=-.5,z1=.5;
  const q=(pts,sh)=>{for(const p of pts){P.push(p[0],p[1],p[2]);C.push(col[0]*sh,col[1]*sh,col[2]*sh);}I.push(vi,vi+1,vi+2,vi,vi+2,vi+3);vi+=4;};
  q([[X,Y-1,z1],[X+1,Y-1,z1],[X+1,Y,z1],[X,Y,z1]],1);
  q([[X,Y-1,z0],[X+1,Y-1,z0],[X+1,Y,z0],[X,Y,z0]],.8);
  if(!op(x-1,y))q([[X,Y-1,z0],[X,Y-1,z1],[X,Y,z1],[X,Y,z0]],.65);
  if(!op(x+1,y))q([[X+1,Y-1,z0],[X+1,Y-1,z1],[X+1,Y,z1],[X+1,Y,z0]],.65);
  if(!op(x,y-1))q([[X,Y,z0],[X+1,Y,z0],[X+1,Y,z1],[X,Y,z1]],.9);
  if(!op(x,y+1))q([[X,Y-1,z0],[X+1,Y-1,z0],[X+1,Y-1,z1],[X,Y-1,z1]],.5);}
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));

 return itemGeoCache[b]=geo;}

function matchGrid(cells,w){
 let x0=w,y0=w,x1=-1,y1=-1;
 for(let i=0;i<cells.length;i++)if(cells[i]){const x=i%w,y=(i/w)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
 if(x1<0)return null;
 const bw=x1-x0+1,bh=y1-y0+1;
 for(const r of RCP){if(r.w!==bw||r.h!==bh)continue;
  let a=true,m=true;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
   const g=cells[(y0+y)*w+x0+x];
   if(g!==r.cells[y*bw+x])a=false;
   if(g!==r.cells[y*bw+(bw-1-x)])m=false;}
  if(a||m)return r;}
 return null;}

 const r=matchGrid(craft.map(c=>c?c.b:0),2);outs[0]=r?{b:r.out.b,n:r.out.n}:null;

function countOf(b){let n=0;for(const s of inv)if(s&&s.b===b)n+=s.n;return n;}
function takeOne(b){for(let i=35;i>=0;i--){const s=inv[i];if(s&&s.b===b){s.n--;if(s.n<=0)inv[i]=null;return true;}}return false;}
function canFit(it){let left=it.n;const mx=stackOf(it.b);
 for(let i=0;i<36&&left>0;i++){const s=inv[i];if(!s)left-=mx;else if(s.b===it.b)left-=mx-s.n;}
 return left<=0;}

 if(isSprite(b)){x.drawImage(sprite(b),0,0,48,48);return iconCache[b]=c;}

 let [sx,sy]=tile(BT[b].t);

function takeOutput(g,shift){
 const o=stores[g][0];if(!o)return;

 const consume=()=>{for(let i=0;i<grid.length;i++){const c=grid[i];if(c){c.n--;if(c.n<=0)grid[i]=null;}}};
 if(shift){ /* Shift: اصنع أكبر عدد ممكن مباشرة إلى الحقيبة */
  for(let k=0;k<64;k++){const it=stores[g][0];if(!it||!canFit(it))break;giveItem(it);consume();refreshOut();}
  return;}

function clickSlot(g,i,right,shift){
 if(g==='out'||g==='out3'){takeOutput(g,shift);afterInvChange();return;}
 if(!stores[g])return;
 const arr=stores[g],s=arr[i];
 if(shift){quickMove(g,i);afterInvChange();return;}
 if(!cursor){
  if(!s)return;
  if(right){const take=Math.ceil(s.n/2);cursor={b:s.b,n:take};s.n-=take;if(s.n<=0)arr[i]=null;}
  else{cursor=s;arr[i]=null;}
 }else{
  if(g==='furn'&&i===2){ /* خانة ناتج الفرن: للأخذ فقط */
   if(s&&cursor.b===s.b&&cursor.n+s.n<=stackOf(s.b)){cursor.n+=s.n;arr[i]=null;}
   afterInvChange();return;}
  if(!slotAccepts(g,i,cursor))return;
  if(!s){
   if(right){arr[i]={b:cursor.b,n:1};cursor.n--;if(cursor.n<=0)cursor=null;}
   else{arr[i]=cursor;cursor=null;}
  }else if(s.b===cursor.b){
   const room=stackOf(s.b)-s.n,m=right?Math.min(1,room):Math.min(room,cursor.n);
   s.n+=m;cursor.n-=m;if(cursor.n<=0)cursor=null;
  }else{arr[i]=cursor;cursor=s;}
 }
 afterInvChange();}

function updateMobs(dt){

 spawnT+=dt;if(spawnT>.9){spawnT=0;trySpawn();}
 for(let i=MOBS.length-1;i>=0;i--){
  const m=MOBS[i],D=m.def;
  if(m.dead){m.deadT+=dt;m.root.rotation.z=Math.min(1.5,m.deadT*4);if(m.flash&&m.deadT>.3)restoreMat(m);if(m.deadT>.7)removeMob(m);continue;}
  const dx=pos.x-m.x,dz=pos.z-m.z,dist=Math.hypot(dx,dz);
  if(dist>(D.hostile?64:110)){removeMob(m);continue;}
  if(dist>56)continue;

  if(vis){
   const ux=dx/(dist||1),uz=dz/(dist||1);spd=D.spd;
   if(m.type==='skeleton'){
    if(dist>9){wx=ux*spd;wz=uz*spd;}else if(dist<5){wx=-ux*spd;wz=-uz*spd;}
    m.shootCd-=dt;
    if(m.shootCd<=0&&dist<15&&dist>3&&los(m.x,m.y+1.45,m.z,pos.x,pos.y+1.1,pos.z)){shoot(m);m.shootCd=1.8+Math.random()*.6;}
   }else{

   }
   m.yaw+=angDiff(m.yaw,Math.atan2(dx,dz))*(1-Math.exp(-dt*10));
  }else if(m.fleeT>0){
   m.fleeT-=dt;const fx=m.x-m.fx,fz=m.z-m.fz,fl=Math.hypot(fx,fz)||1;spd=D.spd*1.9;wx=fx/fl*spd;wz=fz/fl*spd;
   m.yaw+=angDiff(m.yaw,Math.atan2(wx,wz))*(1-Math.exp(-dt*10));
  }else{
   m.timer-=dt;
   if(m.state==='idle'){
    if(m.timer<=0){const a=Math.random()*6.2832,r=3+Math.random()*5,tx=m.x+Math.cos(a)*r,tz=m.z+Math.sin(a)*r;
     if(groundOK(tx,tz)){m.state='walk';m.timer=5;m.tx=tx;m.tz=tz;}else m.timer=1+Math.random()*2;}
   }else{
    const ex=m.tx-m.x,ez=m.tz-m.z,el=Math.hypot(ex,ez);

   }
  }

  /* حركة الأطراف */
  const mv=Math.hypot(m.vx,m.vz);m.phase+=dt*mv*3;
  const sw=Math.sin(m.phase)*Math.min(1,mv/1.5)*.8,R=m.rig;

  else{const sg=R.legs.length===4?[1,-1,-1,1]:[1,-1];R.legs.forEach((l,k)=>{l.rotation.x=sg[k]*sw;});
   if(R.arms&&m.type==='skeleton'){R.arms[0].rotation.x=-1.3+sw*.15;R.arms[1].rotation.x=-1.3-sw*.15;}
   if(R.wings&&m.fleeT>0){const f=Math.sin(m.phase*8)*.9;R.wings[0].rotation.z=.6+f;R.wings[1].rotation.z=-.6-f;}}

 }}

const DMGB=[2,3,2,4,1];
function toolDmg(){const s=inv[pi];if(!s||s.b<21||s.b>30)return 1;return DMGB[(s.b-21)%5]+(s.b>=26?1:0);}
function mobRay(ox,oy,oz,dx,dy,dz,reach){

 for(const m of MOBS){if(m.dead)continue;
  const r=m.def.w/2+.1;let t0=0,t1=bt;
  const sl=(o,d,a,b)=>{if(Math.abs(d)<1e-9)return o>=a&&o<=b;let u=(a-o)/d,v=(b-o)/d;if(u>v){const q=u;u=v;v=q;}t0=Math.max(t0,u);t1=Math.min(t1,v);return t0<=t1;};

function target(t){

 let bounce=0;const sc=reduce?0:1;

 if(!grounded&&!flying){T.aLz=-1.0;T.aRz=1.0;T.eL=-.4;T.eR=.4;T.lL=.55;T.lR=-.25;T.hx=-.1;}
 else if(mode==='wave'){
  const d=t-t0;
  T.aRz=2.7;T.eR=.35+Math.sin(d*9)*.55*sc;T.hz=.12;T.hy=-.2;T.lean=-.04;
  if(d>3.2)setMode('idle');

}

 /* ---- الهدف: الشعاع يخرج من مركز الشاشة (حيث علامة +) ---- */
 const o=fpv?camera.position:tgt;
 target_=raycastDDA(o.x,o.y,o.z,fwd.x,fwd.y,fwd.z,5);
 if(target_){sel.visible=true;sel.position.set(target_.hit[0]+.5,target_.hit[1]+.5,target_.hit[2]+.5);}else sel.visible=false;

 brkCd-=dt;putCd-=dt;
 if(pendingBreak){pendingBreak=false;if(!invOpen)doBreak();}
 if(!invOpen&&(hold.brk||down.KeyF||mouseBrk)){if(brkCd<=0){doBreak();brkCd=.22;}}else brkCd=0;
 if(!invOpen&&(hold.put||down.KeyG||mousePut)){if(putCd<=0){doPlace();putCd=.22;}}else putCd=0;

 updateParts(dt);
 for(const c of clouds){c.position.x+=dt*.9;if(c.position.x>165)c.position.x=-35;}

 /* ---- اليد ---- */
 if(fpv){
  const bx=Math.sin(phase)*.02*walkAmt*g,by=-Math.abs(Math.sin(phase))*.025*walkAmt*g;
  const idle=reduce?0:Math.sin(t*1.6)*.004;
  const hpx=HAND.x+bx,hpy=HAND.y+by+idle,hpz=HAND.z-sws*.15,hrx=HAND.rx+sws*.45,hry=HAND.ry+sws*.25;
  handPivot.position.set(hpx,hpy,hpz);
  handPivot.rotation.set(hrx,hry,0);
  /* الأداة تُثبَّت عند طرف الذراع وتبقى قائمة (مثل لقطة ماين كرافت) وتميل للأمام عند الضرب */
  heldGrp.position.set(hpx-HAND.L*Math.sin(hry)-.12,hpy+HAND.L*Math.cos(hry)*Math.sin(hrx),hpz-HAND.L*Math.cos(hry)*Math.cos(hrx));
  heldGrp.rotation.set(.05+sws*.6,.06,Math.PI/4);
 }

 if(frame%6===0){drawMap();coordsEl.textContent='X: '+pos.x.toFixed(1)+'\nY: '+pos.y.toFixed(1)+'\nZ: '+pos.z.toFixed(1);}
 renderer.clear();
 renderer.render(scene,camera);
 if(fpv){renderer.clearDepth();renderer.render(handScene,handCam);}
 if(invOpen&&pv&&invMode==='inv')pv.render();
 if(t-lastSave>4){lastSave=t;if(saveDirty||true)saveNow();}
 requestAnimationFrame(tick);
}
tick();
</script>
